services:
  postgres:
    image: postgres:17
    container_name: siger_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: siger_db
      POSTGRES_USER: siger_user
      POSTGRES_PASSWORD: ${SIGER_DB_PASSWORD:?Define SIGER_DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - siger_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siger_user -d siger_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  siger_pgdata:
